name: background task executor

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: build the war
    runs-on: ubuntu-latest
    permissions:
      packages: write # write to github packages
      contents: read # read repo contents
    steps:
      # fetch the project files
      - name: checkout the project
        # pre-defined
        uses: actions/checkout@v4

      - name: setup java 21
        # pre-defined
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR # ENV variable -  GitHub username associated with the triggering event.
          server-password: GITHUB_TOKEN # ENV variable - Automatically generated token used to authenticate with GitHub Packages.


      - name: check if maven exists
        run: |
            if command -v mvn &> /dev/null; then 
              echo "Maven is already installed"
            else 
              echo "Maven is not found. installing..."
              sudo apt-get update
              sudo apt-get install -y maven
            fi
            mvn --version

      - name: build and test
        run: |
          # -B (or --batch-mode): Runs Maven in non-interactive, batch mode
          # -ntp (or --no-transfer-progress): Suppresses the download progress logs for dependencies.
          mvn -B -ntp clean verify
          

      # Step 5: Publish to GitHub Packages
      - name: Publish to GitHub Packages
        run: |
          # mvn deploy runs the complete lifecycle again.
          # mvn deploy:deploy invokes the Deploy Plugin's deploy goal directly, without rerunning the preceding lifecycle.
          # Publish the already-generated WAR file to GitHub Packages without rebuilding the project.
          ## deploy:deploy-file uploads an existing artifact instead of executing the Maven build lifecycle.
          # The main difference is that deploy:deploy publishes an artifact already attached to Maven's current project, whereas deploy:deploy-file publishes a specific file that you explicitly provide.
          #            deploy:deploy                           deploy:deploy-file
          # Deploy the current Maven project artifact  Deploy a specific existing file
          #     Maven project build context              File specified using -Dfile
           mvn -B -ntp deploy:deploy-file \
            -Dfile=target/GitHubActions.war \
            -DpomFile=pom.xml \
            -Dpackaging=war \
            -DrepositoryId=github \
            -Durl="$TASK_GRID_ARTIFACT_URL"
        env:
          GITHUB_ACTOR: ${{ github.actor }} # check my_learning for more details
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_GRID_ARTIFACT_URL: https://maven.pkg.github.com/saipavankiran/cicdworkflows


